name: Publish dev build to TestPyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-testpypi        # no cancel-in-progress: never kill a publish

permissions:
  contents: read

jobs:
  testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read             # actions/checkout needs this
      id-token: write            # required for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build
      - run: ls -la dist/        # shows the derived .devN version
      - run: uv publish --index testpypi --trusted-publishing always
