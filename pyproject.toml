[project]
name = "datadongle"
version = "0.1.0"
description = "Installable data-collector tooling: source collectors, pluggable storage engines, and staged-ingest/SCD2 load strategies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "tenacity",
    "pyyaml",
]

[project.optional-dependencies]
# Relational storage engine (PostgresEngine / MySQLEngine).
postgres = [
    "psycopg2-binary",
    "pymysql",
]
# Geospatial parsing/handling used across collectors and parsers.
geo = [
    "shapely",
    "geopandas",
    "fiona",
    "rasterio",
    "networkx",
]
# Iceberg storage engine (added in the IcebergEngine work).
iceberg = [
    "pyiceberg[sql-sqlite]",
    "duckdb",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datadongle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
